[package]
name = "mstop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A readable, data-rich terminal system monitor for Linux"
license = "MIT"
repository = "https://github.com/msozturktr/mstop"
readme = "README.md"
keywords = ["monitor", "tui", "system", "terminal", "gpu"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.190"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
sysinfo = "0.39.6"
